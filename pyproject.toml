[build-system]
requires = ["uv_build>=0.5,<0.13"]
build-backend = "uv_build"

[project]
name = "emotional_memory"
version = "0.17.0"
description = "Emotional memory library for LLMs based on Affective Field Theory"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "Gianluca Mazza", email = "info@gianlucamazza.it" }]
keywords = ["llm", "memory", "emotion", "affective-computing", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "pydantic>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/gianlucamazza/emotional-memory"
Repository = "https://github.com/gianlucamazza/emotional-memory"
"Bug Tracker" = "https://github.com/gianlucamazza/emotional-memory/issues"
Changelog = "https://github.com/gianlucamazza/emotional-memory/blob/main/CHANGELOG.md"
Documentation = "https://gianlucamazza.github.io/emotional-memory"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=5",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "ruff>=0.4",
  "mypy>=1.10",
  "basedpyright>=1.18",
  "fakeredis>=2.35.1",
]
bench = ["pytest-benchmark>=4.0", "psutil>=5.9", "tqdm>=4.65"]
llm-test = ["httpx>=0.27"]
demo = ["gradio>=6.13,<7"]
dotenv = ["python-dotenv>=1.0"]
sentence-transformers = ["sentence-transformers>=2.2"]
sqlite = ["sqlite-vec>=0.1.1"]
qdrant = ["qdrant-client>=1.10"]
# CVE-2026-45829 affects chromadb >=1.0.0,<=1.5.9; 1.5.9 is still the latest
# release on PyPI, so the <1.0 ceiling is the mitigation, not a compatibility
# choice. Do not widen it (a dependabot bump to <2.0 silently re-admitted the
# vulnerable range in #122) until a patched >=1.5.10 is published.
chroma = ["chromadb>=0.6.3,<1.0"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
redis = ["redis>=5.0"]
langchain = ["langchain-core>=0.3"]
mem0 = ["mem0ai>=2.0"]
viz = ["matplotlib>=3.7"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-include-markdown-plugin>=7.1",
]
release = [
  "build>=1.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "twine>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -m 'not llm and not appraisal_quality and not slow'"
pythonpath = ["tests", "benchmarks", "scripts"]
python_files = ["test_*.py", "bench_*.py"]
python_functions = ["test_*", "bench_*"]
asyncio_mode = "auto"
strict_markers = true
timeout = 120
markers = [
  "fidelity: psychological fidelity benchmarks",
  "perf: performance benchmarks",
  "llm: integration tests requiring a real LLM (skipped without EMOTIONAL_MEMORY_LLM_API_KEY)",
  "appraisal_quality: LLM appraisal prompt quality benchmarks (skipped without EMOTIONAL_MEMORY_LLM_API_KEY)",
  "slow: slow integration tests (benchmark-level fixtures)",
]
# Fail on deprecations from our own code so they surface in CI instead of
# rotting silently; third-party noise gets a targeted, commented ignore.
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  # chromadb 0.6.x triggers PydanticDeprecatedSince211 on current pydantic 2.x;
  # safe to ignore until we can bump to a CVE-patched chromadb >=1.5.10 on PyPI.
  "ignore:Accessing the 'model_fields' attribute on the instance is deprecated.*:pydantic.warnings.PydanticDeprecatedSince211",
]

[tool.coverage.run]
source = ["emotional_memory"]
branch = true
# Optional-dep store adapters are exercised by their dedicated CI jobs
# (`extra-tests`, `optional-backends-tests`) which install the matching
# extras.  The main `test` matrix only installs dev+viz, so including
# these files in its coverage measurement would yield a misleading
# under-count.  Re-add an entry here when introducing a new optional-
# backend adapter that the main matrix can't import.
omit = ["*/stores/qdrant.py", "*/stores/chroma.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
fail_under = 80

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.format]
# Ruff >= 0.16 formats Python code blocks inside Markdown by default; earlier
# versions do not. Docs snippets are illustrative (partial classes, elided
# imports) and were never in the formatter's scope, so exclude them explicitly —
# otherwise `make lint` passes or fails depending on the installed ruff version.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "W",
  "UP",
  "B",
  "SIM",
  "RUF",
  "C4",
  "T20",
  "TCH",
  "PERF",
  "S",
  "PTH",
]

[tool.ruff.lint.per-file-ignores]
"src/emotional_memory/__init__.py" = ["F401"]
"tests/**" = ["S101", "S603", "S607"]
"benchmarks/**" = ["S101", "T201", "S311", "TCH"]
"examples/**" = ["T201"]
# S310: release scripts fetch hardcoded https endpoints (PyPI, Zenodo, SWH).
# Kept as a per-file ignore rather than inline `# noqa: S310` because ruff's
# S310 detection varies across versions, and an inline directive that a newer
# ruff no longer needs fails the lint gate under RUF100.
"scripts/**" = ["T201", "S603", "S314", "S311", "S306", "S607", "E501", "S310"]
"tools/**" = ["T201", "S603", "S314", "S311"]
"demo/**" = ["T201", "TCH"]
"src/**" = ["TCH"]

[tool.ruff.lint.isort]
known-first-party = ["emotional_memory"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
packages = ["emotional_memory"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional dependencies without bundled type stubs — ignore missing imports
# so mypy works whether or not the extra is installed, with no # type: ignore
# comments needed in source code.
module = ["sentence_transformers"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["qdrant_client", "qdrant_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["httpx"]
ignore_missing_imports = true

[tool.basedpyright]
# Secondary type checker complementing mypy. Mypy stays as primary
# (PEP 484 reference) and basedpyright catches inference / unreachable-code /
# overload issues mypy misses.
include = ["src/emotional_memory"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[dependency-groups]
dev = ["fakeredis>=2.35.1"]
