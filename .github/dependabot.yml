version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "mkdocs*"
          - "mkdocstrings*"
          - "pip-audit"
          - "psutil"
          - "httpx"
      optional-extras:
        patterns:
          - "sentence-transformers"
          - "sqlite-vec"
          - "matplotlib"
          - "python-dotenv"
          - "langchain-core"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Security updates only (limit 0 disables version updates): group coupled stacks in uv.lock
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      langchain:
        applies-to: security-updates
        patterns:
          - "langchain*"
          - "langgraph*"
          - "langsmith"
      pydantic:
        applies-to: security-updates
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      opentelemetry:
        applies-to: security-updates
        patterns:
          - "opentelemetry-*"
      fastapi:
        applies-to: security-updates
        patterns:
          - "fastapi"
          - "starlette"
