name: Release to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install release dependencies
        run: uv sync --frozen --extra release

      - name: Resolve release version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(uv run python scripts/resolve_version.py)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Zenodo DOI freshness
        if: github.event_name == 'push'
        # Fail fast if this tag reuses the previous release's version_doi — the
        # signature of a tag pushed without running 'make release' (which reserves
        # a fresh Zenodo DOI before tagging). Pure-git, offline check.
        run: uv run python scripts/check_doi_freshness.py --current "${GITHUB_REF_NAME}"

      - name: Fast release preflight
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: uv run python scripts/preflight.py --fast --ci "$RELEASE_VERSION"

      - name: Build package
        run: uv build

      - name: Validate artefacts
        run: uv run python -m twine check dist/*

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest SBOM (CycloneDX)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: "sbom.cdx.json"

      - name: Upload release artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emotional-memory-${{ steps.version.outputs.version }}-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

      - name: Verify PyPI release
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: uv run python scripts/verify_pypi_release.py "$RELEASE_VERSION"

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract the matching version section from CHANGELOG.md as release notes.
          notes_file="$(mktemp)"
          awk -v ver="$RELEASE_VERSION" '
            $0 ~ ("^## \\[" ver "\\]") {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > "$notes_file"
          {
            echo ""
            echo "---"
            echo ""
            echo "**PyPI**: https://pypi.org/project/emotional-memory/${RELEASE_VERSION}/"
          } >> "$notes_file"
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::notice::GitHub release v${RELEASE_VERSION} already exists — uploading assets only"
            gh release upload "v${RELEASE_VERSION}" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "v${RELEASE_VERSION}" \
              --title "v${RELEASE_VERSION}" \
              --notes-file "$notes_file" \
              --verify-tag \
              dist/*.whl dist/*.tar.gz
          fi

      - name: Release summary
        if: always()
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          JOB_STATUS: ${{ job.status }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Release workflow"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Version: ${RELEASE_VERSION}"
            echo "- Job status: ${JOB_STATUS}"
            echo "- Artefacts: uploaded to workflow artifacts (incl. SBOM)"
            echo "- Provenance: SLSA build provenance attestation generated"
            echo "- SBOM: CycloneDX attestation generated"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "- PyPI path: trusted publishing + PEP 740 attestations"
              echo "- Verify locally: \`gh attestation verify <wheel> -R ${GH_REPOSITORY}\`"
              echo "- Manual fallback: \`make publish-pypi-manual\`"
            else
              echo "- Publish step skipped for workflow_dispatch"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
