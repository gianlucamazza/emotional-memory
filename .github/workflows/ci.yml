name: CI

on:
  push:
    branches: ["main"]
  # Stacked PRs need the same validation before they are retargeted to main.
  pull_request:
  workflow_dispatch:
    inputs:
      run_llm_tests:
        description: "Run real-LLM tests (requires LLM_API_KEY secret)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format check (ruff format)
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra viz

      - name: Generate all figures
        run: make figures

      - name: Run tests with coverage
        run: >
          uv run python -m pytest
          --cov --cov-report=xml --cov-report=html --cov-fail-under=80
          --override-ini="addopts=-q --tb=short -m 'not llm and not appraisal_quality'"

      - name: Upload coverage HTML report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false

  typecheck:
    name: Type check (mypy + basedpyright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Install all optional extras whose imports appear at module/TYPE_CHECKING
        # level, so mypy and basedpyright can fully resolve all type annotations.
        # sentence-transformers and chromadb are lazy (try/except + TYPE_CHECKING)
        # but still installed here so the type checkers see zero missing-import
        # warnings; uv caches the wheels across runs.
        run: >
          uv sync --frozen --extra dev --extra viz --extra langchain --extra llm-test
          --extra qdrant --extra chroma --extra sentence-transformers
      - name: Type check (mypy)
        run: uv run mypy src/emotional_memory/
      - name: Verify py.typed marker
        run: test -f src/emotional_memory/py.typed
      - name: Type check (basedpyright)
        run: uv run basedpyright src/emotional_memory/

  meta-integrity:
    name: Meta / release metadata integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install release dependencies
        run: uv sync --frozen --extra release

      - name: Check release metadata
        run: uv run python scripts/check_release_metadata.py

      - name: Check Python version SSOT consistency
        run: uv run python scripts/check_python_version_consistency.py

      - name: Check metadata SSOT (author, license, keywords)
        run: uv run python scripts/check_metadata_ssot.py

      - name: Fast CI preflight
        run: uv run python scripts/preflight.py --fast --ci

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Export requirements for audit
        run: uv export --frozen --extra dev --no-hashes -o /tmp/audit-requirements.txt

      - name: Install pip-audit
        run: uv pip install pip-audit --system

      - name: Audit dependencies
        run: pip-audit -r /tmp/audit-requirements.txt

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write  # benchmark-action auto-push to the bench-data branch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra bench

      - name: Run fidelity benchmarks
        run: uv run python -m pytest benchmarks/fidelity/ -v

      - name: Validate paper tables are up-to-date
        run: make reproduce-paper-check

      - name: Run performance benchmarks
        run: >
          uv run python -m pytest benchmarks/perf/
          --benchmark-only
          --benchmark-sort=mean
          --benchmark-json=/tmp/benchmark-results.json
          --override-ini="timeout=0"

      - name: Seed bench-data from gh-pages history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          # Merge recovered history into bench-data; never replace, never --force.
          # 73d1cfb is the first-run seed (114 entries, trailing ';' that the
          # action could not parse). Union that payload with the current tip.
          HISTORY_SHA=73d1cfb069f026fad8b03e9163d0fb290d500d47
          git fetch origin +refs/heads/bench-data:refs/remotes/origin/bench-data || true
          git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages || true
          recover_dir="$(mktemp -d)"
          if git cat-file -e "${HISTORY_SHA}:dev/bench/data.js" 2>/dev/null; then
            git show "${HISTORY_SHA}:dev/bench/data.js" > "${recover_dir}/data.js"
            if git cat-file -e "${HISTORY_SHA}:dev/bench/index.html" 2>/dev/null; then
              git show "${HISTORY_SHA}:dev/bench/index.html" > "${recover_dir}/index.html"
            fi
          else
            python3 scripts/recover_bench_history.py \
              --source origin/gh-pages \
              --output "$recover_dir"
          fi
          work="$(mktemp -d)"
          if git rev-parse --verify origin/bench-data >/dev/null 2>&1; then
            python3 scripts/seed_bench_data_branch.py \
              --recover-dir "$recover_dir" \
              --work "$work" \
              --existing-ref origin/bench-data
          else
            python3 scripts/seed_bench_data_branch.py \
              --recover-dir "$recover_dir" \
              --work "$work"
          fi
          # GitHub's git HTTP endpoint rejects "Authorization: bearer".
          # Do not echo this URL — it embeds GH_TOKEN. No --force.
          git -C "$work" push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            HEAD:refs/heads/bench-data

      # Always runs on push to main (this job's `if`). The action authenticates
      # with github-token via https://x-access-token:…@github.com/… (same as
      # the seed step) and appends to bench-data; persist-credentials is off.
      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: pytest
          output-file-path: /tmp/benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "130%"
          comment-on-alert: true
          # 130% balances useful regression signal vs GH-hosted runner noise
          # (a 10% gate is too tight; 150% was too permissive). See CONTRIBUTING.
          # Own branch: docs.yml assembles dev/bench into the Pages artifact.
          # Sharing gh-pages with mkdocs gh-deploy --force --clean wiped dev/.
          gh-pages-branch: bench-data
          benchmark-data-dir-path: dev/bench

  extra-tests:
    name: Optional extras tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install all optional dependencies
        run: >
          uv sync --frozen --extra dev
          --extra sqlite --extra langchain --extra sentence-transformers
          --extra viz --extra dotenv
          --extra qdrant --extra chroma --extra redis --extra mem0 --extra otel
      - name: Generate all figures
        run: make figures
      - name: SQLite store + examples
        run: uv run python -m pytest tests/test_sqlite_store.py tests/test_examples.py -v
      - name: LangChain adapter
        run: uv run python -m pytest tests/test_langchain_adapter.py -v
      - name: SentenceTransformer embedder
        run: uv run python -m pytest tests/test_sentence_transformers_extra.py -v
      - name: Visualization
        run: uv run python -m pytest tests/test_visualization.py tests/test_figure_inventory.py -v
      - name: Verify dotenv importable
        run: uv run python -c "from dotenv import load_dotenv; print('dotenv OK')"
      - name: Full core tests with all extras present
        run: >
          uv run python -m pytest tests/ -q
          -m "not llm and not appraisal_quality"

  optional-backends-tests:
    name: Optional backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: qdrant
            test_file: tests/test_qdrant_store.py
          - backend: chroma
            test_file: tests/test_chroma_store.py
          - backend: redis
            test_file: tests/test_redis_state_store.py

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ${{ matrix.backend }} extra
        env:
          BACKEND: ${{ matrix.backend }}
        run: uv sync --frozen --extra dev --extra "$BACKEND"
      - name: Run ${{ matrix.backend }} store tests
        env:
          TEST_FILE: ${{ matrix.test_file }}
        run: uv run python -m pytest "$TEST_FILE" -v

  fly-tests:
    name: affective-fly host adapter
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install core + affective-fly from GitHub
        run: |
          uv sync --frozen --extra dev
          uv pip install "affective-fly @ git+https://github.com/gianlucamazza/affective-fly.git"
      - name: Fly host adapter + example
        run: >
          uv run python -m pytest
          tests/test_fly_adapter.py tests/test_examples.py::test_fly_affect_source_runs -v

  demo-check:
    name: Demo smoke tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install demo dependencies
        run: uv sync --frozen --extra dev --extra demo --extra viz
      - name: Run demo tests
        run: >
          uv run python -m pytest tests/test_demo_app.py tests/test_demo_ui_config.py -v
          --override-ini="addopts=-q --tb=short"

  llm-tests:
    name: LLM integration + quality benchmarks
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_llm_tests == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra llm-test

      - name: Validate LLM test files are importable
        run: uv run python -m pytest --collect-only -m llm -q

      - name: Run LLM integration tests
        env:
          EMOTIONAL_MEMORY_LLM_API_KEY: ${{ secrets.EMOTIONAL_MEMORY_LLM_API_KEY }}
          EMOTIONAL_MEMORY_LLM_BASE_URL: ${{ vars.EMOTIONAL_MEMORY_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          EMOTIONAL_MEMORY_LLM_MODEL: ${{ vars.EMOTIONAL_MEMORY_LLM_MODEL || 'gpt-5-mini' }}
          EMOTIONAL_MEMORY_LLM_OUTPUT_MODE: ${{ vars.EMOTIONAL_MEMORY_LLM_OUTPUT_MODE || 'plain' }}
          EMOTIONAL_MEMORY_LLM_TIMEOUT_SECONDS: ${{ vars.EMOTIONAL_MEMORY_LLM_TIMEOUT_SECONDS || '30' }}
        run: uv run python -m pytest tests/test_llm_integration.py -v -m llm

      - name: Run appraisal quality benchmarks
        env:
          EMOTIONAL_MEMORY_LLM_API_KEY: ${{ secrets.EMOTIONAL_MEMORY_LLM_API_KEY }}
          EMOTIONAL_MEMORY_LLM_BASE_URL: ${{ vars.EMOTIONAL_MEMORY_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          EMOTIONAL_MEMORY_LLM_MODEL: ${{ vars.EMOTIONAL_MEMORY_LLM_MODEL || 'gpt-5-mini' }}
          EMOTIONAL_MEMORY_LLM_OUTPUT_MODE: ${{ vars.EMOTIONAL_MEMORY_LLM_OUTPUT_MODE || 'plain' }}
          EMOTIONAL_MEMORY_LLM_TIMEOUT_SECONDS: ${{ vars.EMOTIONAL_MEMORY_LLM_TIMEOUT_SECONDS || '30' }}
          EMOTIONAL_MEMORY_LLM_REPEATS: "1"
        run: uv run python -m pytest benchmarks/appraisal_quality/ -v -m appraisal_quality
