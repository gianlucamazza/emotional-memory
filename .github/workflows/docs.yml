name: Docs

# Assembles MkDocs (`site/`) plus dev/bench (from the bench-data branch, or
# reconstructed from gh-pages history) and deploys one artifact.
# Requires Settings → Pages → Source: GitHub Actions (not the gh-pages branch).
#
# Triggered after the CI workflow completes on main so Benchmarks Seed/Store
# has updated bench-data first. No direct `push` trigger: CI already runs on
# every main push (including docs-only), and a parallel push-triggered Docs
# run was deploying a stale 1-entry chart ~5 min before Seed/Store finished.
# workflow_dispatch remains for a manual rebuild.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: ["main"]
  workflow_dispatch:

# One Pages pipeline. cancel-in-progress: false so a newer run queues instead
# of aborting an in-flight post-Benchmarks upload (a cancelled deploy can
# leave the previous artifact). The later run still wins once it deploys.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build MkDocs + dev/bench
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # workflow_run's github.sha is default-branch HEAD at event time,
          # which can be newer than the CI run. Pin the triggering commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Off: checkout of workflow_run.head_sha + a writable cache is
          # CodeQL cache-poisoning (even though branches: [main] means the
          # SHA is already on main). Docs runs once per successful CI.
          enable-cache: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install docs dependencies
        run: uv sync --frozen --extra docs

      - name: Build docs
        run: uv run mkdocs build

      - name: Fetch bench-data and gh-pages history
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/bench-data:refs/remotes/origin/bench-data || true
          git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages || true

      - name: Attach dev/bench dashboard
        run: |
          set -euo pipefail
          python3 scripts/recover_bench_history.py \
            --prefer origin/bench-data \
            --source origin/gh-pages \
            --output site/dev/bench

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
