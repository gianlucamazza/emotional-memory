name: Dependabot auto-merge

on:
  pull_request:

# Write access is job-scoped below. Workflow-level write on pull_request is
# overly broad if a new job is added later without an actor/author gate.
permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # PR author + same-repo head: github.actor is spoofable (later commits on
    # a Dependabot-authored branch can keep actor == dependabot[bot]).
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == github.event.pull_request.head.repo.full_name
    permissions:
      contents: write # gh pr merge --auto needs to enable auto-merge
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch/minor + Actions)
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.package-ecosystem == 'github-actions'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          # Skip megagroups (>20 deps) — keep majors/groups manual
          IFS=',' read -r -a DEPS <<< "${DEPENDENCY_NAMES:-}"
          # trim empties
          count=0
          for d in "${DEPS[@]+"${DEPS[@]}"}"; do
            [ -n "${d// }" ] && count=$((count+1))
          done
          if [ "$count" -gt 20 ]; then
            echo "Skip auto-merge: dependency group has $count packages (>20)"
            exit 0
          fi
          if [ "${UPDATE_TYPE:-}" = "version-update:semver-major" ]; then
            echo "Skip auto-merge: semver-major"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
