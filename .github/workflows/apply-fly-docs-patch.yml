name: apply-fly-docs-patch

on:
  push:
    branches: [cursor/wire-fly-affect-host-a400]
    paths:
      - ".github/workflows/apply-fly-docs-patch.yml"
      - "patches/fly-docs.patch"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Makefile README ROADMAP patch and remove helper files
        run: |
          git apply patches/fly-docs.patch
          git rm -f .github/workflows/apply-fly-docs-patch.yml patches/fly-docs.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile README.md ROADMAP.md
          git commit -m "docs: document FlyAffectHost in README, Makefile, and roadmap"
          git push
